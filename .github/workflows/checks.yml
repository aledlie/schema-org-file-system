name: Checks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "checks-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Match the local interpreter: flake8 parses with the running Python's
          # ast, so an older one can reject syntax this codebase is allowed to use.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lint.txt

      # Deliberately not `pip install -e ".[dev]"` — the base dependencies pull
      # torch via python-doctr, which would dominate the runtime of a lint job.
      - name: Install lint toolchain
        run: pip install -r requirements-lint.txt

      - name: black --check
        run: black --check --diff src/ scripts/ tests/

      - name: flake8
        run: flake8 src/ scripts/ tests/

  # Separate job, not another step above: this one needs SQLAlchemy + pydantic
  # to import the models, which the lint job deliberately does without. Keeping
  # them apart also means a style failure and a schema failure report as two
  # distinct red checks instead of one truncated log.
  schema-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-schema-check.txt

      - name: Install schema-check toolchain
        run: pip install -r requirements-schema-check.txt

      # Fails when src/storage/models.py has changed without re-running
      # scripts/d1/generate_schema.py. Fix: run it and commit schema.sql.
      - name: scripts/d1/schema.sql matches the models
        run: pytest tests/unit/test_d1_schema_drift.py -q
