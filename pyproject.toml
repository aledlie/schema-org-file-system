[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schema-org-file-system"
version = "2.1.0"
description = "AI-powered file organization using CLIP vision, OCR, and Schema.org metadata"
readme = "CLAUDE.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Alyshia Ledlie"}
]
keywords = [
    "file-organization",
    "schema-org",
    "ai",
    "clip",
    "ocr",
    "metadata"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: File Managers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies (required for basic functionality)
dependencies = [
    "Pillow>=12.2.0",
    "pillow-heif>=1.4.0",
    "piexif>=1.1.3",
    "python-doctr[torch]>=1.0.1",
    "geopy>=2.4.1",
    "SQLAlchemy>=2.0.51",
    "pandas>=3.0.3",
    "requests>=2.34.2",
    "tqdm>=4.68.3",
    "PyYAML>=6.0.3",
    "fastapi>=0.139.0",
    "pydantic>=2.13.4",
    "cleanco>=2.3",
]

[project.optional-dependencies]
# AI/ML features (CLIP vision classification)
ai = [
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "open-clip-torch>=3.3.0",
    "opencv-python>=4.13.0.92",
    "numpy>=2.5.0",
    "easyocr>=1.7.2",
]

# Document processing
docs = [
    "python-docx>=1.2.0",
    "pypdf>=6.14.2",
    "PyPDF2>=3.0.1",
    "pdf2image>=1.17.0",
    "openpyxl>=3.1.5",
    "lxml>=6.1.1",
]

# Error tracking and monitoring
monitoring = [
    "sentry-sdk>=2.63.0",
]

# Person-name validation gate (local-only). nameparser = name shape;
# probablepeople = CRF person/corporation tagging. Optional: the validator
# degrades gracefully (unavailable layers score None) without this extra.
names = [
    "nameparser>=1.4.0",
    "probablepeople>=0.5.6",
]

# Text→location address extraction. pyap detects full street addresses in free
# text; usaddress (CRF) tags bare "City ST ZIP". Optional: the extractor
# degrades gracefully (returns nothing) without them.
geo = [
    "pyap>=0.3.1",
    "usaddress>=0.5.16",
    "us>=3.2.0",
]

# Classical ML (scikit-learn) — backs src/ml (data_preprocessor: train/test
# split, CountVectorizer, LabelEncoder) for `organize-files preprocess` /
# `evaluate`, and the interior-probe prototype. Floor tracks the tested build
# and stays >=1.5.0 for numpy-2.0 compatibility (the `ai` extra pins numpy>=2.5.0).
ml = [
    "scikit-learn>=1.9.0",
]

# All optional features
all = [
    "schema-org-file-system[ai,docs,monitoring,ml,names,geo]",
]

# Development dependencies
dev = [
    "pytest>=9.1.1",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.0",
    "pytest-asyncio>=1.0.0",
    "pytest-xdist>=3.5.0",
    "faker>=20.0.0",
    "factory-boy>=3.3.0",
    "hypothesis>=6.92.0",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
    "jsonschema>=4.26.0",
]

[project.scripts]
organize-files = "src.cli:main"

[project.urls]
Homepage = "https://github.com/aledlie/schema-org-file-system"
Repository = "https://github.com/aledlie/schema-org-file-system.git"
Issues = "https://github.com/aledlie/schema-org-file-system/issues"

[tool.setuptools]
packages = ["src", "src.storage", "src.scoring", "src.scoring.signals", "src.classifiers"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
"*" = ["*.md", "*.json"]
"src.classifiers" = ["data/census_names/*.txt"]

[tool.black]
line-length = 100
target-version = ['py312', 'py313']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | venv
    | build
    | dist
    | node_modules
    | results
    | _site
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip = [".git", ".venv", "venv", "build", "dist", "node_modules", "results", "_site"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
    "node_modules",
    "results",
    "_site",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
pythonpath = [".", "src", "scripts"]
